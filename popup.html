<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuizMagic Answers</title><style>
:root{--bg:#f7f8fc;--panel:#fff;--text:#151923;--muted:#6b7280;--line:#e6e8ef;--brand:#5b46e8;--brand2:#7463f1;--green:#15803d;--greenbg:#ecfdf3;--warnbg:#fff8e7;--warnborder:#f2c14e;--shadow:0 10px 28px rgba(15,23,42,.10)}*{box-sizing:border-box}body{width:420px;max-height:640px;margin:0;padding:12px;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;overflow:hidden}.app{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px 9px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand-logo{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 4px 12px rgba(91,70,232,.25);flex:0 0 auto}.brand-logo img{width:100%;height:100%;display:block}.brand-copy{min-width:0}.brand-title{margin:0;font-size:14px;line-height:17px;font-weight:800;letter-spacing:-.15px}.brand-subtitle{margin:2px 0 0;color:var(--muted);font-size:10px;line-height:12px;white-space:nowrap}.github-link{width:28px;height:28px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;background:#fff;color:#171717;cursor:pointer;text-decoration:none;transition:.15s ease;flex:0 0 auto}.github-link:hover{transform:translateY(-1px);border-color:#cfd3dc;background:#f5f6f8}.github-link svg{width:15px;height:15px;fill:currentColor}.body{padding:11px}.row{display:flex;gap:7px;margin-bottom:9px}input{min-width:0;flex:1;padding:9px 10px;border:1px solid #d9dce5;border-radius:9px;outline:none;background:#fbfcff;color:var(--text);font-size:12px}input:focus{border-color:#8b80ec;box-shadow:0 0 0 3px rgba(91,70,232,.10)}button.action{padding:9px 13px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--b
